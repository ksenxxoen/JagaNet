# The OpenAPI 3.1 description of the panel's /v1 API (epic #117, W-2). Kept by hand, next to the routes in
# server/src/main/kotlin/dev/jaganet/server/http/*.kt and the models in shared/.../api/Models.kt and the server DTOs.
# OpenApiTest fails when a route is missing here (or is here but not in Ktor), when a component with
# x-kotlin no longer matches its class, or when a key endpoint answers something this file does not allow.
# A new model's schema: OPENAPI_DUMP (see OpenApiDumpTest) prints it. The website's types come from here:
# `npm run gen:api` in web/ (web/src/api/schema.d.ts). Served to the owner as /v1/openapi.json.
openapi: 3.1.0
info:
  title: Boop panel API
  version: '1'
  description: 'The /v1 API of the Boop (JagaNet) panel: website, apps, Telegram bot and mini app, node agents.


    Hand-kept next to the routes (server/src/main/resources/openapi.yaml). OpenApiTest checks that every /v1 route is here
    and back, that every component with `x-kotlin` matches its @Serializable class, and validates real answers of the key
    endpoints. See docs/WEB-FRONTEND.md, "API description".


    JSON: fields with defaults are always sent, null fields are left out (unless the schema says `x-explicit-nulls`); unknown
    request fields are ignored. Errors: `{"error": {"code", "message"}}` with the HTTP status; the message is translated by
    `Accept-Language` (ru, de, en).'
servers:
- {url: /}
tags:
- {name: public, description: No session needed.}
- {name: user, description: A signed-in user (Bearer session token).}
- {name: owner, description: The owner (admin panel).}
- {name: telegram, description: 'Telegram sign-in, linking and the mini app.'}
- {name: node, description: 'Node agents, with the node token (not a user session).'}
security:
- {bearer: []}
paths:
  /v1/app/desktop:
    get:
      tags: [public]
      summary: The latest desktop app build (404 until one is published)
      operationId: getAppDesktop
      parameters:
      - name: platform
        in: query
        schema: {type: string, enum: [windows, linux]}
        description: 'Without it: the Windows build (all Windows clients).'
      - name: distro
        in: query
        schema: {type: string}
        description: Linux only, e.g. ubuntu24.04.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DesktopAppManifest'}
        default: {$ref: '#/components/responses/Error'}
  /v1/auth/email/start:
    post:
      tags: [public]
      summary: Send a sign-in code by e-mail
      operationId: postAuthEmailStart
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailStartReq'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailStartRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/auth/email/verify:
    post:
      tags: [public]
      summary: Sign in with the e-mailed code
      operationId: postAuthEmailVerify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailVerifyReq'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/auth/pair/redeem:
    post:
      tags: [public]
      summary: Sign in a new device with a pairing code
      operationId: postAuthPairRedeem
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PairRedeemReq'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/auth/app/start:
    post:
      tags: [public]
      summary: Start signing in an app through the website
      operationId: postAuthAppStart
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppLoginStartReq'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppLoginStartRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/auth/app/poll:
    post:
      tags: [public]
      summary: The app asks whether its sign-in was allowed
      operationId: postAuthAppPoll
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppLoginPollReq'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppLoginPollRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/auth/app/{id}:
    get:
      tags: [user]
      summary: An app sign-in request, for the website to confirm
      operationId: getAuthAppById
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppLoginInfo'}
        default: {$ref: '#/components/responses/Error'}
  /v1/auth/app/{id}/allow:
    post:
      tags: [user]
      summary: Allow an app sign-in request
      operationId: postAuthAppByIdAllow
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/auth/logout:
    post:
      tags: [user]
      summary: Sign out this session
      operationId: postAuthLogout
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/auth/link/redeem:
    post:
      tags: [public]
      summary: Sign in with a one-time link (e-mail, bot)
      operationId: postAuthLinkRedeem
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LinkLoginReq'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/me:
    get:
      tags: [user]
      summary: The account, plan and entitlement
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeRes'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [user]
      summary: Delete the account
      operationId: deleteMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/me/payments:
    get:
      tags: [user]
      summary: The account's payments
      operationId: getMePayments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentsRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/me/lang:
    put:
      tags: [user]
      summary: The account's language (bot messages, e-mails)
      operationId: putMeLang
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetLangReq'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/servers:
    get:
      tags: [user]
      summary: VPN locations
      operationId: getServers
      parameters:
      - name: supportedProtocols
        in: query
        schema: {type: string}
        description: Comma-separated protocol ids the app runs, e.g. amneziawg,vless. Without it opt-in protocols (VLESS)
          are left out.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServersRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/tunnel:
    post:
      tags: [user]
      summary: A tunnel config for this device
      operationId: postTunnel
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TunnelProvisionReq'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TunnelConfig'}
        default: {$ref: '#/components/responses/Error'}
    get:
      tags: [user]
      summary: This device's current tunnel
      operationId: getTunnel
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TunnelState'}
        default: {$ref: '#/components/responses/Error'}
  /v1/tunnel/events:
    post:
      tags: [user]
      summary: A connection event from the app
      operationId: postTunnelEvents
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectionEventReq'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/devices:
    get:
      tags: [user]
      summary: The account's devices
      operationId: getDevices
      parameters:
      - name: supportedProtocols
        in: query
        schema: {type: string}
        description: Comma-separated protocol ids the app runs, e.g. amneziawg,vless. Without it opt-in protocols (VLESS)
          are left out.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DevicesRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/devices/{id}:
    patch:
      tags: [user]
      summary: Rename a device
      operationId: patchDevicesById
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenameDeviceReq'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkRes'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [user]
      summary: Remove a device
      operationId: deleteDevicesById
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/devices/pairing-code:
    post:
      tags: [user]
      summary: A code to sign in another device
      operationId: postDevicesPairingCode
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PairingCodeRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/stats:
    get:
      tags: [user]
      summary: Traffic statistics of the account
      operationId: getStats
      parameters:
      - name: period
        in: query
        schema: {type: string, enum: [day, week, month], default: week}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatsRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/billing/plans:
    get:
      tags: [public]
      summary: Plans and prices (apps)
      operationId: getBillingPlans
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlansRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/monitor:
    get:
      tags: [owner]
      summary: Server monitoring
      operationId: getAdminMonitor
      parameters:
      - name: range
        in: query
        schema: {type: string, enum: [1h, 24h, 7d, 30d], default: 24h}
        description: Anything else is 24h.
      description: 'Owner only: 401 without a session, 403 for other users.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MonitorRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/servers/overview:
    get:
      tags: [owner]
      summary: The server status page in one request
      operationId: getAdminServersOverview
      parameters:
      - name: range
        in: query
        schema: {type: string, enum: [1h, 24h, 7d, 30d], default: 24h}
        description: Anything else is 24h.
      - name: open
        in: query
        schema: {type: string}
        description: Comma-separated server ids whose charts are open (up to 50).
      description: 'Owner only: 401 without a session, 403 for other users.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServersOverviewRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/monitor/test:
    post:
      tags: [owner]
      summary: Send a test alert
      operationId: postAdminMonitorTest
      description: 'Owner only: 401 without a session, 403 for other users.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/settings:
    get:
      tags: [owner]
      summary: Panel settings
      operationId: getAdminSettings
      description: 'Owner only: 401 without a session, 403 for other users.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSettingsRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/settings/plans:
    put:
      tags: [owner]
      summary: Save plan settings
      operationId: putAdminSettingsPlans
      description: 'Owner only: 401 without a session, 403 for other users.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanSettings'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSettingsRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/settings/smtp:
    put:
      tags: [owner]
      summary: Save e-mail (SMTP) settings
      operationId: putAdminSettingsSmtp
      description: 'Owner only: 401 without a session, 403 for other users.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SmtpSettings'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSettingsRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/settings/alerts:
    put:
      tags: [owner]
      summary: Save alert settings
      operationId: putAdminSettingsAlerts
      description: 'Owner only: 401 without a session, 403 for other users.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlertSettings'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSettingsRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/settings/modes:
    put:
      tags: [owner]
      summary: Save modes (test payments, sign-in codes)
      operationId: putAdminSettingsModes
      description: 'Owner only: 401 without a session, 403 for other users.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModeSettings'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSettingsRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/settings/network:
    put:
      tags: [owner]
      summary: Save network settings
      operationId: putAdminSettingsNetwork
      description: 'Owner only: 401 without a session, 403 for other users.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NetworkSettings'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSettingsRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/settings/notice:
    put:
      tags: [owner]
      summary: Save the notice shown in the apps
      operationId: putAdminSettingsNotice
      description: 'Owner only: 401 without a session, 403 for other users.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NoticeSettings'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSettingsRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/settings/smtp/test:
    post:
      tags: [owner]
      summary: Send a test e-mail
      operationId: postAdminSettingsSmtpTest
      description: 'Owner only: 401 without a session, 403 for other users.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TestEmailReq'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/blocklist:
    get:
      tags: [owner]
      summary: Check an address against Russian block lists
      operationId: getAdminBlocklist
      parameters:
      - name: host
        in: query
        schema: {type: string}
        required: true
        description: An IP address or a domain name.
      description: 'Owner only: 401 without a session, 403 for other users.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BlocklistRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/test-accounts:
    get:
      tags: [owner]
      summary: Test accounts
      operationId: getAdminTestAccounts
      description: 'Owner only: 401 without a session, 403 for other users.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TestAccountsRes'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [owner]
      summary: Create test accounts
      operationId: postAdminTestAccounts
      description: 'Owner only: 401 without a session, 403 for other users.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TestAccountsReq'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TestAccountsRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/test-accounts/{id}/assign:
    post:
      tags: [owner]
      summary: Give a test account to someone
      operationId: postAdminTestAccountsByIdAssign
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      description: 'Owner only: 401 without a session, 403 for other users.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssignTestAccountReq'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssignTestAccountRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/test-accounts/{id}:
    delete:
      tags: [owner]
      summary: Delete a test account
      operationId: deleteAdminTestAccountsById
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      description: 'Owner only: 401 without a session, 403 for other users.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/tariffs:
    get:
      tags: [owner]
      summary: Tariffs
      operationId: getAdminTariffs
      description: 'Owner only: 401 without a session, 403 for other users.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminTariffsRes'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [owner]
      summary: Create a tariff
      operationId: postAdminTariffs
      description: 'Owner only: 401 without a session, 403 for other users.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TariffReq'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminTariffsRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/tariffs/{id}:
    put:
      tags: [owner]
      summary: Change a tariff
      operationId: putAdminTariffsById
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      description: 'Owner only: 401 without a session, 403 for other users.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TariffReq'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminTariffsRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/finance:
    get:
      tags: [owner]
      summary: Money summary
      operationId: getAdminFinance
      parameters:
      - name: period
        in: query
        schema: {type: string, enum: [7d, 30d, 90d, all], default: 30d}
        description: Anything else is 30d.
      description: 'Owner only: 401 without a session, 403 for other users.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FinanceRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/node/register:
    post:
      tags: [node]
      summary: A node agent registers itself
      operationId: postNodeRegister
      security:
      - {nodeToken: []}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NodeRegisterReq'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeRegisterRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/node/peers:
    get:
      tags: [node]
      summary: The node's peers (long poll while the version is unchanged)
      operationId: getNodePeers
      parameters:
      - name: version
        in: query
        schema: {type: string}
        description: 'The peers version the agent has: the answer waits (up to 25 s) while it is current.'
      security:
      - {nodeToken: []}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodePeersRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/node/report:
    post:
      tags: [node]
      summary: A node agent's report
      operationId: postNodeReport
      security:
      - {nodeToken: []}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NodeReportReq'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkRes'}
        default: {$ref: '#/components/responses/Error'}
  /v1/admin/nodes:
    get:
      tags: [owner]
      summary: Nodes
      operationId: getAdminNodes
      description: 'Owner only: 401 without a session, 403 for other users.'
      responses:
        '200':
          description: OK
          content:
