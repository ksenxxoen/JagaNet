# CI for the Windows desktop client (desktop/): vet, tests, a cross-compiled
# unsigned Boop.exe as a download, and the browser checks on fakes.
# No secrets, no signing, no releases, no deploys.
name: desktop

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [claude/adoring-brown-s8fqex]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: desktop

jobs:
  build:
    name: vet, test, Boop.exe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The PR's own commit, not the merge commit GitHub builds.
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      # build.sh first: it fetches build/wintun.dll (the setup program packs it) and
      # makes the resources. No BOOP_SIGN, so signing is skipped.
      - name: build.sh
        run: ./build.sh "0.0.0-ci+${HEAD_SHA::7}"

      - name: go vet (linux)
        run: go vet ./...

      - name: go vet (windows)
        run: GOOS=windows GOARCH=amd64 go vet ./...

      # Issue #78: Boop.exe is the window only; the engine (Xray-core, AmneziaWG) is
      # BoopService.exe's. Checked on the package graphs and on the built files.
      - name: Boop.exe has no engine, BoopService.exe has no window
        run: scripts/check-deps.sh dist

      # Issue #53: the embedded Xray-core must not be older than the nodes' (the one
      # constant to change is NodeCoreVersion in vpn/xray/version.go).
      - name: xray-core not older than the nodes
        run: go test -count=1 -run '^TestEmbeddedCoreNotOlderThanNodes$' -v ./vpn/xray/

      # No GPL code in the binaries. Xray-core up to 25.x imported sagernet/sing
      # (GPL-3.0); 26.x does not. If a new version brings it back, stop here.
      - name: no GPL modules linked
        run: |
          mods="$( { GOOS=windows go list -deps -f '{{with .Module}}{{.Path}}{{end}}' . ;
                     GOOS=linux go list -deps -tags boopapp -f '{{with .Module}}{{.Path}}{{end}}' . ./cmd/... ; } | sort -u)"
          echo "$mods"
          if grep -E '^github\.com/sagernet/' <<<"$mods"; then
            echo "::error::a GPL module is linked (see desktop/ARCHITECTURE.md, Licences)"
            exit 1
          fi

      - name: go test
        run: go test -race -count=1 ./...

      # A real Xray node of the version the nodes run, built from source (NodeCoreModule),
      # for TestExternalNode below: the embedded engine against it on Vision and XHTTP.
      - name: Xray node binary
        run: |
          mod="$(sed -n 's/^[[:space:]]*NodeCoreModule = "\(.*\)"$/\1/p' vpn/xray/version.go)"
          test -n "$mod"
          GOBIN="$RUNNER_TEMP/xray-node" go install -trimpath github.com/xtls/xray-core/main@"$mod"
          "$RUNNER_TEMP/xray-node/main" version

      # Xray-core's Vision and XHTTP do not survive -race (checkptr, a race inside
      # XHTTP's client; see vpn/xray/race_test.go), so the VLESS tests carry
      # traffic over them in a second run without it.
      - name: go test (VLESS without -race, real Xray node)
        env:
          BOOP_XRAY_BIN: ${{ runner.temp }}/xray-node/main
          BOOP_XRAY_REQUIRED: "1"
        run: |
          go test -count=1 ./vpn/xray/
          go test -count=1 -run '^TestExternalNode$' -v ./vpn/xray/ | grep -E '^\s*(---|externalnode_test|ok|PASS|FAIL)'

      - name: SHA-256
        run: |
          summary=""
          for f in Boop.exe BoopService.exe; do
            sum="$(sha256sum "dist/$f" | cut -d' ' -f1)"
            echo "$f SHA-256: $sum"
            summary+="* $f: SHA-256 \`$sum\`, $(stat -c %s "dist/$f") bytes"$'\n'
          done
          {
            echo "### Boop.exe and BoopService.exe (unsigned, 0.0.0-ci+${HEAD_SHA::7})"
            echo
            printf '%s\n' "$summary"
            echo "Download: artifact \`Boop.exe-${HEAD_SHA}\` on this run's page (both files, kept 7 days)."
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Boop.exe-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            desktop/dist/Boop.exe
            desktop/dist/BoopService.exe
          retention-days: 7
          if-no-files-found: error

      # Wintun's own signed wintun.dll (build.sh fetched it and checked its hash):
      # the setup program packs it as it is.
      - uses: actions/upload-artifact@v4
        with:
          name: wintun-${{ github.event.pull_request.head.sha || github.sha }}
          path: desktop/build/wintun.dll
          retention-days: 7
          if-no-files-found: error

      # The 1.4.x line (one Boop.exe that is also the service), built from the
      # commit before the split, for the upgrade tests on Windows below.
      - uses: actions/checkout@v4
        with:
          ref: c66363b29f11aafffab1d7d6e7e468821a176924
          path: baseline

      - name: Boop.exe 1.4.4 (baseline for the upgrade tests)
        working-directory: baseline/desktop
        run: ./build.sh 1.4.4

      - uses: actions/upload-artifact@v4
        with:
          name: Boop-1.4.4-${{ github.event.pull_request.head.sha || github.sha }}
          path: baseline/desktop/dist/Boop.exe
          retention-days: 7
          if-no-files-found: error

  ui:
    name: ui-checks, e2e (Chromium, fakes)
    # Not ubuntu-latest: Playwright installs Chromium and its system packages only
    # for Ubuntu releases it knows, and 1.56 does not know 26.04. Bump both together.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The scripts require("playwright") from desktop/scripts; there is no
      # package.json, so it is installed outside the checkout and found via NODE_PATH.
      PLAYWRIGHT_VERSION: 1.56.1
      NODE_PATH: ${{ github.workspace }}/../pw/node_modules
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Playwright + Chromium
        run: |
          pw="$(dirname "$NODE_PATH")"
          mkdir -p "$pw"
          npm install --prefix "$pw" --no-save --no-package-lock --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          "$NODE_PATH/.bin/playwright" install --with-deps chromium

      - name: ui-checks
        run: node scripts/ui-checks.mjs

      - name: e2e
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          E2E_LOGS="$RUNNER_TEMP/e2e-logs" node scripts/e2e.mjs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 7
          if-no-files-found: ignore

  # Issue #65 / #79: what needs no service on Windows. Everything that installs,
  # upgrades or removes the service is the setup program's and is tried in the
  # windows-installer job below (the service is registered by the setup only).
  windows-service:
    name: window without a service on Windows (e2e)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Boop.exe-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist

      # Issue #79: a copy that runs from "Downloads" (portable) registers and
      # writes nothing: no service, no autostart value, no toast keys, no file
      # next to the exe, no scheduled task, and no schtasks/reg/powershell/cmd child.
      - name: portable copy registers nothing
        run: |
          $dl = Join-Path $env:USERPROFILE 'Downloads\boop-portable'
          New-Item -ItemType Directory -Force $dl | Out-Null
          Copy-Item dist\Boop.exe $dl
          Copy-Item dist\BoopService.exe $dl
          $before = (Get-ChildItem $dl -Recurse | ForEach-Object Name | Sort-Object) -join ','
          $o = Join-Path $env:TEMP 'portable-check.txt'
          $p = Start-Process -FilePath "$dl\Boop.exe" -ArgumentList '--service-check' -Wait -PassThru -RedirectStandardOutput $o
          Write-Host "service-check exit $($p.ExitCode): $(Get-Content $o -Raw)"
          $after = (Get-ChildItem $dl -Recurse | ForEach-Object Name | Sort-Object) -join ','
          if ($before -ne $after) { throw "files appeared next to the exe: $before -> $after" }
          if ($null -ne (Get-Service BoopVPN -ErrorAction SilentlyContinue)) { throw 'a service was registered' }
          if (Test-Path 'HKCU:\Software\Classes\AppUserModelId\Boop.VPN') { throw 'toast keys were written' }
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).BoopVPN
          if ($run) { throw "autostart value was written: $run" }
          schtasks.exe /Query /TN 'Boop VPN' 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'a scheduled task was created' }
          if (Test-Path "$env:ProgramFiles\Boop") { throw 'Program Files\Boop was created' }
          Write-Host 'ok: the portable copy registered and wrote nothing'
          exit 0 # the last native call (schtasks /Query) is expected to fail; do not leak its code

      # Issue #72: the toast keys and the WinRT calls must not fail (nobody clicks here).
      - name: toast registration and notification (no interaction)
        run: |
          $exe = Join-Path $PWD 'dist\Boop.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--toast-selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA 'Boop\toast-selftest.log'
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            throw "toast selftest exited $($p.ExitCode)"
          }
          Write-Host 'ok: toast selftest'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: service-logs
          path: |
            C:\ProgramData\Boop\*.log
          retention-days: 7
          if-no-files-found: ignore

  # Issue #64: Boop-Setup-<version>.exe (Inno Setup) around the same Boop.exe the
  # build job made. Silent install -> service Running -> silent uninstall ->
  # service and files gone. Unsigned here (no secrets in CI).
  windows-installer:
    name: Boop-Setup.exe on Windows (build + e2e)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Boop.exe-${{ github.event.pull_request.head.sha || github.sha }}
          path: desktop/dist

      - uses: actions/download-artifact@v4
        with:
          name: wintun-${{ github.event.pull_request.head.sha || github.sha }}
          path: desktop/build

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Inno Setup
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: build the setup program
        run: ./desktop/installer/build.ps1

      # The 1.4.4 setup program (one Boop.exe, which is also the service), built
      # from the commit before the split, to update over.
      - uses: actions/checkout@v4
        with:
          ref: c66363b29f11aafffab1d7d6e7e468821a176924
          path: baseline

      - uses: actions/download-artifact@v4
        with:
          name: Boop-1.4.4-${{ github.event.pull_request.head.sha || github.sha }}
          path: baseline/desktop/dist

      - name: build the 1.4.4 setup program
        run: ./baseline/desktop/installer/build.ps1

      - name: update over 1.4.4 (silent)
        run: |
          $old = (Get-ChildItem baseline/desktop/dist/Boop-Setup-1.4.4.exe).FullName
          $new = (Get-ChildItem desktop/dist/Boop-Setup-*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:ProgramFiles 'Boop'
          $data = Join-Path $env:ProgramData 'Boop'
          function Dump {
            foreach ($f in @("$data\install.log", "$data\service.log")) {
              if (Test-Path $f) { Write-Host "--- $f"; Get-Content $f -Tail 60 }
            }
            Get-ChildItem $env:TEMP -Filter 'Setup Log*' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName -Tail 80 }
          }
          function Check($ok, $what) {
            if (-not $ok) { Dump; throw "FAILED: $what" }
            Write-Host "ok: $what"
          }
          function Setup($exe, $argv) { (Start-Process -FilePath $exe -ArgumentList $argv -Wait -PassThru).ExitCode }
          function Binary { (Get-CimInstance Win32_Service -Filter "Name='BoopVPN'").PathName }
          function ServiceCheck($exe) {
            $o = Join-Path $env:TEMP 'service-check.txt'
            Remove-Item $o -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -ArgumentList '--service-check' -Wait -PassThru -RedirectStandardOutput $o
            $text = if (Test-Path $o) { (Get-Content $o -Raw) } else { '' }
            Write-Host "service-check: exit $($p.ExitCode): $text"
            return [pscustomobject]@{ Code = $p.ExitCode; Text = "$text" }
          }
          $silent = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /LOG'

          Check ((Setup $old $silent) -eq 0) '1.4.4 installs'
          Check ((Get-Service BoopVPN).Status -eq 'Running') '1.4.4 service Running'
          Check ((Binary) -match 'Boop\.exe"? --service') 'the 1.4.4 service runs Boop.exe --service'
          Check (-not (Test-Path "$dir\BoopService.exe")) '1.4.4 has no BoopService.exe'

          # What 1.3.x/1.4.x left: the old scheduled task and the user's Run value.
          schtasks.exe /Create /TN 'Boop VPN' /TR 'cmd.exe /c exit' /SC ONLOGON /RL HIGHEST /F | Out-Null
          $runBefore = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).BoopVPN
          Write-Host "Run value before: $runBefore"

          Check ((Setup $new $silent) -eq 0) 'the new setup installs over 1.4.4'
          schtasks.exe /Query /TN 'Boop VPN' 2>$null | Out-Null
          Check ($LASTEXITCODE -ne 0) 'the old scheduled task is gone'
          if ($runBefore) {
            $runAfter = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').BoopVPN
            Check ($runAfter -match 'Boop\.exe"? --tray') 'autostart is kept (Run value points at Boop.exe --tray)'
          }
          Check ((Get-Service BoopVPN).Status -eq 'Running') 'service Running after the update'
          Check ((Binary) -match 'BoopService\.exe"? --service') 'the service now runs BoopService.exe'
          Check (Test-Path "$dir\Boop.exe") 'Boop.exe (window) in Program Files'
          Check (Test-Path "$dir\wintun.dll") 'wintun.dll in Program Files'
          $r = ServiceCheck "$dir\Boop.exe"
          Check ($r.Code -eq 0 -and $r.Text -match 'protocol 1\.\.2') 'window <-> updated service: protocol 1..2'

          $unins = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /PURGEDATA' -Wait -PassThru
          Check ($unins.ExitCode -eq 0) 'uninstall exits 0'
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Service BoopVPN -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          Check ($null -eq (Get-Service BoopVPN -ErrorAction SilentlyContinue)) 'service removed'
          exit 0 # schtasks /Query above fails on purpose

      - name: install, upgrade, uninstall (silent)
        run: |
          $setup = (Get-ChildItem desktop/dist/Boop-Setup-*.exe | Select-Object -First 1).FullName
          Write-Host "setup: $setup"
          $dir = Join-Path $env:ProgramFiles 'Boop'
          $data = Join-Path $env:ProgramData 'Boop'
          function Dump {
            foreach ($f in @("$data\install.log", "$data\service.log")) {
              if (Test-Path $f) { Write-Host "--- $f"; Get-Content $f -Tail 60 }
            }
            Get-ChildItem $env:TEMP -Filter 'Setup Log*' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName -Tail 60 }
          }
          function Check($ok, $what) {
            if (-not $ok) { Dump; throw "FAILED: $what" }
            Write-Host "ok: $what"
          }
          function Setup($argv) {
            (Start-Process -FilePath $setup -ArgumentList $argv -Wait -PassThru).ExitCode
          }
          $silent = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /LOG'

          Check ((Setup "$silent /TASKS=autostart") -eq 0) 'install exits 0'
          Check ((Get-Service BoopVPN).Status -eq 'Running') 'service BoopVPN is Running'
          Check (Test-Path "$dir\Boop.exe") 'Boop.exe in Program Files'
          Check (Test-Path "$dir\BoopService.exe") 'BoopService.exe in Program Files'
          Check (Test-Path "$dir\wintun.dll") 'wintun.dll in Program Files'
          Check (Test-Path "$dir\unins000.exe") 'uninstaller present'
          Check ([System.IO.Directory]::GetFiles('\\.\pipe\') -contains '\\.\pipe\BoopVPN') 'pipe BoopVPN exists'
          Check (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Boop VPN.lnk") 'Start menu shortcut'
          $acl = (Get-Acl $dir).Access | Where-Object { $_.IdentityReference -match 'Users$' }
          Check (($acl | Where-Object { $_.FileSystemRights -match 'Write|Modify|FullControl' }).Count -eq 0) 'Users cannot write Program Files\Boop'
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).BoopVPN
          Write-Host "Run key: $run"   # informational: the runner has no interactive shell for runasoriginaluser

          # Over an existing install (the service is running).
          Check ((Setup "$silent /TASKS=autostart") -eq 0) 'install over the existing one exits 0'
          Check ((Get-Service BoopVPN).Status -eq 'Running') 'service Running after upgrade'

          # Uninstall, data kept by default.
          New-Item -ItemType Directory -Force "$data" | Out-Null
          Set-Content "$data\keep.txt" 'x'
          $unins = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          Check ($unins.ExitCode -eq 0) 'uninstall exits 0'
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Service BoopVPN -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          while ((Test-Path "$dir\Boop.exe") -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          Check ($null -eq (Get-Service BoopVPN -ErrorAction SilentlyContinue)) 'service removed'
          Check (-not (Test-Path "$dir\Boop.exe")) 'Boop.exe removed'
          Check (-not (Test-Path "$dir\BoopService.exe")) 'BoopService.exe removed'
          Check (-not (Test-Path "$dir\wintun.dll")) 'wintun.dll removed'
          Check (Test-Path "$data\keep.txt") 'data kept without /PURGEDATA'
          Check (-not (Test-Path 'HKCU:\Software\Classes\AppUserModelId\Boop.VPN')) 'toast AUMID key removed'
          Check (-not (Test-Path 'HKCU:\Software\Classes\boop')) 'boop: protocol key removed'

          # Again, now with /PURGEDATA.
          Check ((Setup $silent) -eq 0) 'second install exits 0'
          $unins = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /PURGEDATA' -Wait -PassThru
          Check ($unins.ExitCode -eq 0) 'uninstall /PURGEDATA exits 0'
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $data) -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          Check (-not (Test-Path $data)) 'ProgramData\Boop removed with /PURGEDATA'
          Check ($null -eq (Get-Service BoopVPN -ErrorAction SilentlyContinue)) 'service removed again'

      # Issue #78 / #79: connect through the service the setup program registered.
      # The test (vpn/xray/service_e2e_windows_test.go) is the window: a fake panel
      # hands out a VLESS node (Xray-core in the test process, on loopback), the test
      # sends `up` over the pipe, checks `status`, carries bytes through the tunnel,
      # sends `down`, and checks that the adapter, routes and WFP filters are gone.
      - name: connect through the installed service (fake panel, local Xray node)
        timeout-minutes: 8
        env:
          BOOP_E2E_SERVICE: "1"
        run: |
          $setup = (Get-ChildItem desktop/dist/Boop-Setup-*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:ProgramFiles 'Boop'
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /LOG' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exited $($p.ExitCode)" }
          Push-Location desktop
          try {
            go test -c -o "$env:RUNNER_TEMP\svc-e2e.test.exe" ./vpn/xray/
            if ($LASTEXITCODE -ne 0) { throw 'building the e2e test failed' }
          } finally { Pop-Location }
          try {
            $targs = @('-test.run=^TestServiceConnect$', '-test.v', '-test.timeout=5m')
            & "$env:RUNNER_TEMP\svc-e2e.test.exe" @targs
            $code = $LASTEXITCODE
          } finally {
            # Whatever happened, the tunnel must not outlive the step.
            Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /PURGEDATA' -Wait | Out-Null
          }
          if ($code -ne 0) {
            foreach ($f in @("$env:ProgramData\Boop\service.log")) {
              if (Test-Path $f) { Write-Host "--- $f"; Get-Content $f -Tail 80 }
            }
            throw "connect through the service failed ($code)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Boop-Setup-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            desktop/dist/Boop-Setup-*.exe
            desktop/dist/Boop-Setup-*.exe.sha256
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: installer-logs
          path: |
            C:\ProgramData\Boop\*.log
          retention-days: 7
          if-no-files-found: ignore

  # Stage C-4 of #76: the pipe client of the Tauri shell (desktop/tauri/host) has no GUI
  # dependencies, so it is checked here; the window itself is built on Windows below.
  tauri-host:
    name: Tauri shell, pipe client (clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            desktop/tauri/target
          key: tauri-host-${{ hashFiles('desktop/tauri/Cargo.lock') }}
      - run: cargo clippy -p boop-host --all-targets --locked -- -D warnings
        working-directory: desktop/tauri
      - run: cargo test -p boop-host --locked
        working-directory: desktop/tauri
      - name: no command line tools in the Rust shell
        # The shell starts its own host (BoopHost.exe / BOOP_HOST_EXE) and nothing else.
        run: |
          if grep -rnE '"(schtasks|reg|powershell|pwsh|cmd)(\.exe)?"|ShellExecute' desktop/tauri/app/src desktop/tauri/host/src; then
            echo "::error::the Rust shell must not run schtasks/reg/powershell/cmd or ShellExecute"; exit 1
          fi
        working-directory: .

  # The Tauri window on Windows: built, linted, and started next to the installed 1.5.1
  # service. Smoke: the shell starts the Go host (`Boop.exe --host`), connects to its pipe,
  # gets the first UI state, and closes itself and the host. The installer still installs the
  # Go window (C-4b switches it).
  windows-tauri:
    name: Tauri window on Windows (build + smoke)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Boop.exe-${{ github.event.pull_request.head.sha || github.sha }}
          path: desktop/dist

      - uses: actions/download-artifact@v4
        with:
          name: wintun-${{ github.event.pull_request.head.sha || github.sha }}
          path: desktop/build

      - uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            desktop\tauri\target
          key: tauri-win-${{ hashFiles('desktop/tauri/Cargo.lock') }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Go host (hostpipe) tests
        run: go test ./hostpipe
        working-directory: desktop

      - name: UI for the Tauri window
        shell: bash
        run: ./desktop/tauri/prepare-ui.sh

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: desktop/tauri

      - name: tests
        run: cargo test --workspace --locked
        working-directory: desktop/tauri

      - name: build Boop.exe (Tauri)
        run: cargo build --release -p boop-shell --locked
        working-directory: desktop/tauri

      - name: size and contents
        run: |
          $exe = Get-Item desktop/tauri/target/release/Boop.exe
          $mb = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "Tauri Boop.exe: $mb MB"
          if ($exe.Length -gt 12MB) { throw "Tauri Boop.exe is $mb MB (limit about 10 MB)" }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($bad in 'xray-core', 'amneziawg') {
            if ($text.Contains($bad)) { throw "the Tauri window contains $bad" }
          }

      - name: Inno Setup
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: build the setup program (still the Go window)
        run: ./desktop/installer/build.ps1

      - name: smoke - the Tauri window with the installed service
        run: |
          $setup = (Get-ChildItem desktop/dist/Boop-Setup-*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:ProgramFiles 'Boop'
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /LOG' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exited $($p.ExitCode)" }
          $svc = Get-Service BoopVPN
          if ($svc.Status -ne 'Running') { throw "service is $($svc.Status)" }
          Write-Host 'ok: service running'

          # The Tauri window runs from a folder of its own; its host is the installed Go exe.
          $run = Join-Path $PWD 'tauri-run'
          New-Item -ItemType Directory -Force $run | Out-Null
          Copy-Item desktop/tauri/target/release/Boop.exe "$run\Boop.exe"
          $log = Join-Path $run 'shell.log'
          $env:BOOP_HOST_EXE = Join-Path $dir 'Boop.exe'
          $env:BOOP_SHELL_LOG = $log
          $env:BOOP_SHELL_EXIT_AFTER_STATE = '1'
          $shell = Start-Process -FilePath "$run\Boop.exe" -PassThru
          if (-not $shell.WaitForExit(180000)) {
            $shell.Kill()
            $why = 'the shell did not get a state and close within 180 s'
          } elseif ($shell.ExitCode -ne 0) {
            $why = "the shell exited with $($shell.ExitCode)"
          }
          $hostLog = Join-Path $env:LOCALAPPDATA 'Boop\boop-host.log'
          Write-Host '--- shell.log'; if (Test-Path $log) { Get-Content $log }
          Write-Host '--- boop-host.log'; if (Test-Path $hostLog) { Get-Content $hostLog -Tail 40 }
          if ($why) { throw $why }
          $text = Get-Content $log -Raw
          if ($text -notmatch 'hello ok') { throw 'the shell did not reach the host over the pipe' }
          if ($text -notmatch 'state conn=') { throw 'the shell got no state from the host' }
          $hostText = Get-Content $hostLog -Raw
          if ($hostText -match 'service: ') { throw 'the host could not reach the service' }
          Start-Sleep -Seconds 3
          if (Get-Process -Name Boop -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq "$dir\Boop.exe" }) { throw 'the host is still running after the shell closed' }
          Write-Host 'ok: window started, host reached over the pipe, first state received, closed cleanly'

      - name: portable Tauri copy registers nothing
        run: |
          $run = Join-Path $PWD 'tauri-run'
          if (Test-Path 'HKCU:\Software\Classes\AppUserModelId\Boop.VPN') { Write-Host 'note: toast keys come from the installer (installed copy)' }
          $before = (Get-ChildItem $run | ForEach-Object Name | Sort-Object) -join ','
          Write-Host "files next to the shell: $before"
          $extra = Get-ChildItem $run | Where-Object { $_.Name -notin @('Boop.exe', 'shell.log') }
          if ($extra) { throw "the shell wrote files next to itself: $($extra.Name -join ', ')" }
          Write-Host 'ok: nothing written next to the shell'

      - name: uninstall
        if: always()
        run: |
          $dir = Join-Path $env:ProgramFiles 'Boop'
          if (Test-Path "$dir\unins000.exe") {
            Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /PURGEDATA' -Wait | Out-Null
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Boop-tauri-${{ github.event.pull_request.head.sha || github.sha }}
          path: desktop/tauri/target/release/Boop.exe
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tauri-logs
          path: |
            C:\ProgramData\Boop\*.log
            tauri-run\*.log
          retention-days: 7
          if-no-files-found: ignore
