# CI for the new website (web/, React + Vite, docs/WEB-FRONTEND.md): API types, typecheck, lint, tests, build.
# No secrets, no deploys.
name: web

on:
  pull_request:
    paths:
      - "web/**"
      - "server/src/main/resources/openapi.yaml"
      - "server/src/main/kotlin/dev/jaganet/server/http/MiniApp.kt"
      - "server/src/main/kotlin/dev/jaganet/server/http/WebNext.kt"
      - "server/src/main/resources/web-switch/**"
      - ".github/workflows/web.yml"
  push:
    branches: [claude/adoring-brown-s8fqex]
    paths:
      - "web/**"
      - "server/src/main/resources/openapi.yaml"
      - "server/src/main/kotlin/dev/jaganet/server/http/MiniApp.kt"
      - "server/src/main/kotlin/dev/jaganet/server/http/WebNext.kt"
      - "server/src/main/resources/web-switch/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: web typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same version as the Gradle build (server/build.gradle.kts).
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      # src/api/schema.d.ts is generated from server/src/main/resources/openapi.yaml: it must be current.
      - name: API types are up to date (npm run gen:api)
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || { echo "::error::Run 'npm run gen:api' in web/ and commit src/api/schema.d.ts"; exit 1; }
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # In Chromium, against the panel with WEB_UI=new played by e2e/panel.mjs (W-10): the Telegram mini app under
  # MINIAPP_CSP (read from MiniApp.kt) with a stand-in Telegram.WebApp and demo API answers (no CSP violations,
  # no page errors, QR drawn, toasts shown, the bot's and the preview's addresses), then every link the server
  # and the bot hand out opens its screen of the new website, with a session saved by the old one.
  miniapp-browser:
    name: mini app (CSP) and website links in the browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
