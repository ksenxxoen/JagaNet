# Runs Claude on tasks handed over by another agent (Grok Bot) or a person.
# Protocol: docs/AGENT-TASKS.md
#
# Starts when:
#   - an issue gets the label `claude:todo` (new task);
#   - a comment on an issue or PR mentions @claude (follow-up / fix request).
#
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`)
# or ANTHROPIC_API_KEY.
name: Claude

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One run per issue/PR at a time; a new trigger waits for the running one.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Off by default: tasks are picked up by the hourly cloud session instead.
    # Set the repository variable CLAUDE_ACTIONS_ENABLED=true (and a secret) to turn it on.
    if: |
      vars.CLAUDE_ACTIONS_ENABLED == 'true' && (
      (github.event_name == 'issues' && github.event.label.name == 'claude:todo') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Mark task in progress
        run: |
          gh label create claude:todo        --color 0E8A16 --force >/dev/null
          gh label create claude:in-progress --color FBCA04 --force >/dev/null
          gh label create claude:done        --color 1D76DB --force >/dev/null
          gh label create claude:failed      --color D93F0B --force >/dev/null
          gh issue edit "$NUMBER" \
            --remove-label claude:todo --remove-label claude:done --remove-label claude:failed \
            --add-label claude:in-progress

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          label_trigger: "claude:todo"
          # Grok Bot may post through a GitHub App; list its bot login here if so.
          allowed_bots: ${{ vars.CLAUDE_ALLOWED_BOTS }}
          claude_args: |
            --append-system-prompt "Follow the task protocol in docs/AGENT-TASKS.md. Open a pull request with 'Closes #${{ env.NUMBER }}' when the task is done (or push to the existing PR branch for follow-ups). Finish with a short report comment."
            --allowedTools "Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(./gradlew:*),Bash(git:*)"

      - name: Mark task done
        if: success()
        run: gh issue edit "$NUMBER" --remove-label claude:in-progress --add-label claude:done

      - name: Mark task failed
        if: failure() || cancelled()
        run: |
          gh issue edit "$NUMBER" --remove-label claude:in-progress --add-label claude:failed
          gh issue comment "$NUMBER" --body "Claude run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
