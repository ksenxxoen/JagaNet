# CI for the Windows desktop client (desktop/): vet, tests, a cross-compiled
# unsigned Boop.exe as a download, and the browser checks on fakes.
# No secrets, no signing, no releases, no deploys.
name: desktop

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [claude/adoring-brown-s8fqex]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: desktop

jobs:
  build:
    name: vet, test, Go exes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The PR's own commit, not the merge commit GitHub builds.
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      # build.sh first: it fetches build/wintun.dll (the setup program packs it) and
      # makes the resources. No BOOP_SIGN, so signing is skipped.
      - name: build.sh
        run: ./build.sh "0.0.0-ci+${HEAD_SHA::7}"

      - name: go vet (linux)
        run: go vet ./...

      - name: go vet (windows)
        run: GOOS=windows GOARCH=amd64 go vet ./...

      # Issue #78: Boop.exe is the window only; the engine (Xray-core, AmneziaWG) is
      # BoopService.exe's. Checked on the package graphs and on the built files.
      - name: BoopHost.exe and Boop-bridge.exe have no engine, BoopService.exe has no window
        run: scripts/check-deps.sh dist

      # Issue #53: the embedded Xray-core must not be older than the nodes' (the one
      # constant to change is NodeCoreVersion in vpn/xray/version.go).
      - name: xray-core not older than the nodes
        run: go test -count=1 -run '^TestEmbeddedCoreNotOlderThanNodes$' -v ./vpn/xray/

      # No GPL code in the binaries. Xray-core up to 25.x imported sagernet/sing
      # (GPL-3.0); 26.x does not. If a new version brings it back, stop here.
      - name: no GPL modules linked
        run: |
          mods="$( { GOOS=windows go list -deps -f '{{with .Module}}{{.Path}}{{end}}' . ;
                     GOOS=linux go list -deps -tags boopapp -f '{{with .Module}}{{.Path}}{{end}}' . ./cmd/... ; } | sort -u)"
          echo "$mods"
          if grep -E '^github\.com/sagernet/' <<<"$mods"; then
            echo "::error::a GPL module is linked (see desktop/ARCHITECTURE.md, Licences)"
            exit 1
          fi

      # Issue #81/#82: the update path of the host starts the setup program only through
      # ShellExecute (the bridge: one CreateProcess of the checked file); no cmd, powershell, schtasks or reg child.
      - name: the host update path starts no cmd/powershell/schtasks/reg
        run: |
          if grep -nE 'exec\.Command|"(schtasks|reg|powershell|pwsh|cmd)(\.exe)?"' update_windows.go host_windows.go core/update.go hostpipe/*.go winsvc/*.go cmd/boop-bridge/*.go authenticode/*.go | grep -v _test.go; then
            echo "::error::the update path must not run cmd/powershell/schtasks/reg"; exit 1
          fi

      - name: go test
        run: go test -race -count=1 ./...

      # A real Xray node of the version the nodes run, built from source (NodeCoreModule),
      # for TestExternalNode below: the embedded engine against it on Vision and XHTTP.
      - name: Xray node binary
        run: |
          mod="$(sed -n 's/^[[:space:]]*NodeCoreModule = "\(.*\)"$/\1/p' vpn/xray/version.go)"
          test -n "$mod"
          GOBIN="$RUNNER_TEMP/xray-node" go install -trimpath github.com/xtls/xray-core/main@"$mod"
          "$RUNNER_TEMP/xray-node/main" version

      # Xray-core's Vision and XHTTP do not survive -race (checkptr, a race inside
      # XHTTP's client; see vpn/xray/race_test.go), so the VLESS tests carry
      # traffic over them in a second run without it.
      - name: go test (VLESS without -race, real Xray node)
        env:
          BOOP_XRAY_BIN: ${{ runner.temp }}/xray-node/main
          BOOP_XRAY_REQUIRED: "1"
        run: |
          go test -count=1 ./vpn/xray/
          go test -count=1 -run '^TestExternalNode$' -v ./vpn/xray/ | grep -E '^\s*(---|externalnode_test|ok|PASS|FAIL)'

      - name: SHA-256
        run: |
          summary=""
          for f in BoopHost.exe BoopService.exe Boop-bridge.exe; do
            sum="$(sha256sum "dist/$f" | cut -d' ' -f1)"
            echo "$f SHA-256: $sum"
            summary+="* $f: SHA-256 \`$sum\`, $(stat -c %s "dist/$f") bytes"$'\n'
          done
          {
            echo "### BoopHost.exe, BoopService.exe and Boop-bridge.exe (unsigned, 0.0.0-ci+${HEAD_SHA::7})"
            echo
            printf '%s\n' "$summary"
            echo "Download: artifact \`Boop-go-${HEAD_SHA}\` on this run's page (the three files, kept 7 days)."
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Boop-go-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            desktop/dist/BoopHost.exe
            desktop/dist/BoopService.exe
            desktop/dist/Boop-bridge.exe
          retention-days: 7
          if-no-files-found: error

      # Wintun's own signed wintun.dll (build.sh fetched it and checked its hash):
      # the setup program packs it as it is.
      - uses: actions/upload-artifact@v4
        with:
          name: wintun-${{ github.event.pull_request.head.sha || github.sha }}
          path: desktop/build/wintun.dll
          retention-days: 7
          if-no-files-found: error

      # The 1.4.x line (one Boop.exe that is also the service), built from the
      # commit before the split, for the upgrade tests on Windows below.
      - uses: actions/checkout@v4
        with:
          ref: c66363b29f11aafffab1d7d6e7e468821a176924
          path: baseline

      - name: Boop.exe 1.4.4 (baseline for the upgrade tests)
        working-directory: baseline/desktop
        run: ./build.sh 1.4.4

      - uses: actions/upload-artifact@v4
        with:
          name: Boop-1.4.4-${{ github.event.pull_request.head.sha || github.sha }}
          path: baseline/desktop/dist/Boop.exe
          retention-days: 7
          if-no-files-found: error

      # 1.5.1 (the C-3 setup program, Go window), to update over (C-4b).
      - uses: actions/checkout@v4
        with:
          ref: 9a2a528b9d97273bd73c9954594c0f751d2d03f4
          path: baseline151

      - name: Boop.exe and BoopService.exe 1.5.1 (baseline for the upgrade tests)
        working-directory: baseline151/desktop
        run: ./build.sh 1.5.1

      - uses: actions/upload-artifact@v4
        with:
          name: Boop-1.5.1-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            baseline151/desktop/dist/Boop.exe
            baseline151/desktop/dist/BoopService.exe
            baseline151/desktop/build/wintun.dll
          retention-days: 7
          if-no-files-found: error

      # Issue #82: the REAL 1.4.4 release commit (full SHA; a short ref broke CI once),
      # built with the fake panel's address baked in, for the 1.4.4 -> 2.0.0 e2e.
      - uses: actions/checkout@v4
        with:
          ref: c4ad767145537b428efac1f59efd7c653f280af9
          path: baseline144

      - name: Boop.exe 1.4.4 release commit (fake panel address; e2e baseline)
        working-directory: baseline144/desktop
        run: |
          grep -q 'VERSION="${1:-1.4.4}"' build.sh || { echo "::error::the checked-out commit is not 1.4.4"; exit 1; }
          ./build.sh 1.4.4 http://127.0.0.1:18444

      - uses: actions/upload-artifact@v4
        with:
          name: Boop-1.4.4-e2e-${{ github.event.pull_request.head.sha || github.sha }}
          path: baseline144/desktop/dist/Boop.exe
          retention-days: 7
          if-no-files-found: error

  ui:
    name: ui-checks, e2e (Chromium, fakes)
    # Not ubuntu-latest: Playwright installs Chromium and its system packages only
    # for Ubuntu releases it knows, and 1.56 does not know 26.04. Bump both together.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The scripts require("playwright") from desktop/scripts; there is no
      # package.json, so it is installed outside the checkout and found via NODE_PATH.
      PLAYWRIGHT_VERSION: 1.56.1
      NODE_PATH: ${{ github.workspace }}/../pw/node_modules
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Playwright + Chromium
        run: |
          pw="$(dirname "$NODE_PATH")"
          mkdir -p "$pw"
          npm install --prefix "$pw" --no-save --no-package-lock --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          "$NODE_PATH/.bin/playwright" install --with-deps chromium

      - name: ui-checks
        run: node scripts/ui-checks.mjs

      - name: e2e
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          E2E_LOGS="$RUNNER_TEMP/e2e-logs" node scripts/e2e.mjs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 7
          if-no-files-found: ignore

  # Issue #65 / #79: what needs no service on Windows. Everything that installs,
  # upgrades or removes the service is the setup program's and is tried in the
  # windows-installer job below (the service is registered by the setup only).
  windows-service:
    name: window without a service on Windows (e2e)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Boop-go-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist

      # Issue #79: a copy that runs from "Downloads" (portable) registers and
      # writes nothing: no service, no autostart value, no toast keys, no file
      # next to the exe, no scheduled task, and no schtasks/reg/powershell/cmd child.
      - name: portable copy registers nothing
        run: |
          $dl = Join-Path $env:USERPROFILE 'Downloads\boop-portable'
          New-Item -ItemType Directory -Force $dl | Out-Null
          Copy-Item dist\BoopHost.exe $dl
          Copy-Item dist\BoopService.exe $dl
          $before = (Get-ChildItem $dl -Recurse | ForEach-Object Name | Sort-Object) -join ','
          $o = Join-Path $env:TEMP 'portable-check.txt'
          $p = Start-Process -FilePath "$dl\BoopHost.exe" -ArgumentList '--service-check' -Wait -PassThru -RedirectStandardOutput $o
          Write-Host "service-check exit $($p.ExitCode): $(Get-Content $o -Raw)"
          $after = (Get-ChildItem $dl -Recurse | ForEach-Object Name | Sort-Object) -join ','
          if ($before -ne $after) { throw "files appeared next to the exe: $before -> $after" }
          if ($null -ne (Get-Service BoopVPN -ErrorAction SilentlyContinue)) { throw 'a service was registered' }
          if (Test-Path 'HKCU:\Software\Classes\AppUserModelId\Boop.VPN') { throw 'toast keys were written' }
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).BoopVPN
          if ($run) { throw "autostart value was written: $run" }
          schtasks.exe /Query /TN 'Boop VPN' 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'a scheduled task was created' }
          if (Test-Path "$env:ProgramFiles\Boop") { throw 'Program Files\Boop was created' }
          Write-Host 'ok: the portable copy registered and wrote nothing'
          exit 0 # the last native call (schtasks /Query) is expected to fail; do not leak its code

      # Issue #72: the toast keys and the WinRT calls must not fail (nobody clicks here).
      - name: toast registration and notification (no interaction)
        run: |
          $exe = Join-Path $PWD 'dist\BoopHost.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--toast-selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA 'Boop\toast-selftest.log'
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            throw "toast selftest exited $($p.ExitCode)"
          }
          Write-Host 'ok: toast selftest'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: service-logs
          path: |
            C:\ProgramData\Boop\*.log
          retention-days: 7
          if-no-files-found: ignore

  # Issue #64: Boop-Setup-<version>.exe (Inno Setup) around the same Boop.exe the
  # build job made. Silent install -> service Running -> silent uninstall ->
  # service and files gone. Unsigned here (no secrets in CI).
  windows-installer:
    name: Boop-Setup.exe on Windows (build + e2e)
    needs: [build, windows-tauri]
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Boop-go-${{ github.event.pull_request.head.sha || github.sha }}
          path: desktop/dist

      - uses: actions/download-artifact@v4
        with:
          name: wintun-${{ github.event.pull_request.head.sha || github.sha }}
          path: desktop/build

      # The Tauri window (Boop.exe) built and checked by windows-tauri.
      - uses: actions/download-artifact@v4
        with:
          name: Boop-tauri-${{ github.event.pull_request.head.sha || github.sha }}
          path: desktop/tauri/target/release

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Inno Setup
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: build the setup program (Tauri window + Go host + service)
        run: ./desktop/installer/build.ps1

      # The 1.5.1 setup program (Go window), built from its own commit, to update over.
      - uses: actions/checkout@v4
        with:
          ref: 9a2a528b9d97273bd73c9954594c0f751d2d03f4
          path: baseline151

      - uses: actions/download-artifact@v4
        with:
          name: Boop-1.5.1-${{ github.event.pull_request.head.sha || github.sha }}
          path: baseline151/desktop/_dl

      - name: build the 1.5.1 setup program
        run: |
          New-Item -ItemType Directory -Force baseline151/desktop/dist, baseline151/desktop/build | Out-Null
          Copy-Item (Get-ChildItem baseline151/desktop/_dl -Recurse -Filter Boop.exe).FullName baseline151/desktop/dist/
          Copy-Item (Get-ChildItem baseline151/desktop/_dl -Recurse -Filter BoopService.exe).FullName baseline151/desktop/dist/
          Copy-Item (Get-ChildItem baseline151/desktop/_dl -Recurse -Filter wintun.dll).FullName baseline151/desktop/build/
          ./baseline151/desktop/installer/build.ps1

      # The 1.4.4 setup program (one Boop.exe, which is also the service), built
      # from the commit before the split, to update over.
      - uses: actions/checkout@v4
        with:
          ref: c66363b29f11aafffab1d7d6e7e468821a176924
          path: baseline

      - uses: actions/download-artifact@v4
        with:
          name: Boop-1.4.4-${{ github.event.pull_request.head.sha || github.sha }}
          path: baseline/desktop/dist

      - name: build the 1.4.4 setup program
        run: ./baseline/desktop/installer/build.ps1

      - name: update over 1.4.4 (silent)
        run: |
          $old = (Get-ChildItem baseline/desktop/dist/Boop-Setup-1.4.4.exe).FullName
          $new = (Get-ChildItem desktop/dist/Boop-Setup-*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:ProgramFiles 'Boop'
          $data = Join-Path $env:ProgramData 'Boop'
          function Dump {
            foreach ($f in @("$data\install.log", "$data\service.log")) {
              if (Test-Path $f) { Write-Host "--- $f"; Get-Content $f -Tail 60 }
            }
            Get-ChildItem $env:TEMP -Filter 'Setup Log*' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName -Tail 80 }
          }
          function Check($ok, $what) {
            if (-not $ok) { Dump; throw "FAILED: $what" }
            Write-Host "ok: $what"
          }
          function Setup($exe, $argv) { (Start-Process -FilePath $exe -ArgumentList $argv -Wait -PassThru).ExitCode }
          function Binary { (Get-CimInstance Win32_Service -Filter "Name='BoopVPN'").PathName }
          function ServiceCheck($exe) {
            $o = Join-Path $env:TEMP 'service-check.txt'
            Remove-Item $o -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -ArgumentList '--service-check' -Wait -PassThru -RedirectStandardOutput $o
            $text = if (Test-Path $o) { (Get-Content $o -Raw) } else { '' }
            Write-Host "service-check: exit $($p.ExitCode): $text"
            return [pscustomobject]@{ Code = $p.ExitCode; Text = "$text" }
          }
          $silent = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /LOG'

          Check ((Setup $old $silent) -eq 0) '1.4.4 installs'
          Check ((Get-Service BoopVPN).Status -eq 'Running') '1.4.4 service Running'
          Check ((Binary) -match 'Boop\.exe"? --service') 'the 1.4.4 service runs Boop.exe --service'
          Check (-not (Test-Path "$dir\BoopService.exe")) '1.4.4 has no BoopService.exe'

          # What 1.3.x/1.4.x left: the old scheduled task and the user's Run value.
          schtasks.exe /Create /TN 'Boop VPN' /TR 'cmd.exe /c exit' /SC ONLOGON /RL HIGHEST /F | Out-Null
          $runBefore = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).BoopVPN
          Write-Host "Run value before: $runBefore"

          Check ((Setup $new $silent) -eq 0) 'the new setup installs over 1.4.4'
          schtasks.exe /Query /TN 'Boop VPN' 2>$null | Out-Null
          Check ($LASTEXITCODE -ne 0) 'the old scheduled task is gone'
          if ($runBefore) {
            $runAfter = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').BoopVPN
            Check ($runAfter -match 'Boop\.exe"? --tray') 'autostart is kept (Run value points at Boop.exe --tray)'
          }
          Check ((Get-Service BoopVPN).Status -eq 'Running') 'service Running after the update'
          Check ((Binary) -match 'BoopService\.exe"? --service') 'the service now runs BoopService.exe'
          Check (Test-Path "$dir\Boop.exe") 'Boop.exe (window) in Program Files'
          Check (Test-Path "$dir\wintun.dll") 'wintun.dll in Program Files'
          Check (Test-Path "$dir\BoopHost.exe") 'BoopHost.exe in Program Files'
          $r = ServiceCheck "$dir\BoopHost.exe"
          Check ($r.Code -eq 0 -and $r.Text -match 'protocol 2\.\.3') 'host <-> updated service: protocol 2..3'

          $unins = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /PURGEDATA' -Wait -PassThru
          Check ($unins.ExitCode -eq 0) 'uninstall exits 0'
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Service BoopVPN -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          Check ($null -eq (Get-Service BoopVPN -ErrorAction SilentlyContinue)) 'service removed'

          # Update over 1.5.1 (Go window): settings stay, the service keeps working, the window is Tauri now.
          $old151 = (Get-ChildItem baseline151/desktop/dist/Boop-Setup-1.5.1.exe).FullName
          Check ((Setup $old151 $silent) -eq 0) '1.5.1 installs'
          Check ((Get-Service BoopVPN).Status -eq 'Running') '1.5.1 service Running'
          Check (-not (Test-Path "$dir\BoopHost.exe")) '1.5.1 has no BoopHost.exe'
          $sizeGo = (Get-Item "$dir\Boop.exe").Length
          $mine = Join-Path $env:LOCALAPPDATA 'Boop'
          New-Item -ItemType Directory -Force $mine | Out-Null
          Set-Content "$mine\keep-settings.txt" 'x'
          Set-Content "$env:ProgramData\Boop\keep-data.txt" 'x'
          Check ((Setup $new $silent) -eq 0) 'the new setup installs over 1.5.1'
          Check ((Get-Service BoopVPN).Status -eq 'Running') 'service Running after the update over 1.5.1'
          Check ((Binary) -match 'BoopService\.exe"? --service') 'the service still runs BoopService.exe'
          Check (Test-Path "$dir\BoopHost.exe") 'BoopHost.exe installed over 1.5.1'
          $sizeTauri = (Get-Item "$dir\Boop.exe").Length
          Write-Host "Boop.exe: Go window $sizeGo bytes -> Tauri $sizeTauri bytes"
          Check ($sizeTauri -lt 12MB -and $sizeTauri -ne $sizeGo) 'Boop.exe is now the Tauri window'
          Check (Test-Path "$mine\keep-settings.txt") 'the user settings stay'
          Check (Test-Path "$env:ProgramData\Boop\keep-data.txt") 'the service data stays'
          $r = ServiceCheck "$dir\BoopHost.exe"
          Check ($r.Code -eq 0) 'host <-> service after the update over 1.5.1'
          $unins = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /PURGEDATA' -Wait -PassThru
          Check ($unins.ExitCode -eq 0) 'uninstall exits 0 (after 1.5.1)'
          exit 0 # schtasks /Query above fails on purpose

      # Issue #82 (C-6): update from a REAL 1.4.4 to 2.0.0 the way a customer's machine does
      # it. The 1.4.4 service fetches desktop.json from the fake panel, downloads the
      # bridge (the old url/sha256 fields) and swaps it in for its Boop.exe; the SCM
      # restarts the service, which now is the bridge: it checks the 2.0.0 setup
      # program (SHA-256 + Authenticode + publisher of a CI-only certificate) and runs
      # it as SYSTEM, without a UAC prompt. Checked afterwards: files, service, the
      # sealed token and settings, autostart, old task, leftovers, uninstall.
      - uses: actions/checkout@v4
        with:
          ref: c4ad767145537b428efac1f59efd7c653f280af9
          path: baseline144

      - uses: actions/download-artifact@v4
        with:
          name: Boop-1.4.4-e2e-${{ github.event.pull_request.head.sha || github.sha }}
          path: baseline144/desktop/dist

      - name: update from a real 1.4.4 to 2.0.0 (bridge, migration, no UAC)
        timeout-minutes: 15
        run: |
          $dir = Join-Path $env:ProgramFiles 'Boop'
          $data = Join-Path $env:ProgramData 'Boop'
          $tmp = $env:RUNNER_TEMP
          function Dump {
            foreach ($f in @("$data\install.log", "$data\bridge.log", "$data\service.log", "$tmp\requests.log", "$tmp\spawn.log")) {
              if (Test-Path $f) { Write-Host "--- $f"; Get-Content $f -Tail 80 }
            }
            Get-ChildItem $env:TEMP -Filter 'Setup Log*' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName -Tail 60 }
          }
          function Check($ok, $what) { if (-not $ok) { Dump; throw "FAILED: $what" }; Write-Host "ok: $what" }
          $silent = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /LOG'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          function Binary { (Get-CimInstance Win32_Service -Filter "Name='BoopVPN'").PathName }

          # The 1.4.4 setup program, from the release commit.
          Check ((Get-Item baseline144/desktop/dist/Boop.exe).Length -gt 1MB) 'the 1.4.4 Boop.exe is there'
          ./baseline144/desktop/installer/build.ps1
          $old = (Get-ChildItem baseline144/desktop/dist/Boop-Setup-1.4.4.exe).FullName

          # The 2.0.0 setup program signed with a CI-only certificate, and a bridge that
          # trusts exactly that publisher and the fake panel (the same source as
          # dist/Boop-bridge.exe, other -X values).
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=BoopCI' -CertStoreLocation Cert:\CurrentUser\My
          $cer = Join-Path $tmp 'boopci.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          $new = (Get-ChildItem desktop/dist/Boop-Setup-2.0.0.exe).FullName
          $signed = Join-Path $tmp 'Setup-2.0.0-signed.exe'
          Copy-Item $new $signed
          Check ((Set-AuthenticodeSignature -FilePath $signed -Certificate $cert -HashAlgorithm SHA256).Status -eq 'Valid') 'the 2.0.0 setup program is signed'
          $bridge = Join-Path $tmp 'Boop-bridge.exe'
          Push-Location desktop
          try {
            $env:GOOS = 'windows'
            go build -trimpath -ldflags '-s -w -X main.version=2.0.0 -X main.apiBase=http://127.0.0.1:18444 -X main.setupPublisher=BoopCI' -o $bridge ./cmd/boop-bridge
            if ($LASTEXITCODE -ne 0) { throw 'building the bridge failed' }
          } finally { Pop-Location }
          $manifest = Join-Path $tmp 'desktop.json'
          [ordered]@{
            version = '2.0.0'; url = 'http://127.0.0.1:18444/bridge.exe'; sha256 = (Get-FileHash $bridge).Hash.ToLower(); mandatory = $false
            installer_version = '2.0.0'; installer_url = 'http://127.0.0.1:18444/setup.exe'; installer_sha256 = (Get-FileHash $signed).Hash.ToLower()
            min_proto = 3; kind = 'installer'
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM $manifest

          # The fake panel, in its own process.
          $stop = Join-Path $tmp 'panel.stop'; Remove-Item $stop -ErrorAction SilentlyContinue
          $panel = Start-Process pwsh -PassThru -ArgumentList @('-NoProfile', '-File', (Resolve-Path desktop/scripts/fake-desktop-json.ps1).Path,
            '-Port', '18444', '-Manifest', $manifest, '-Bridge', $bridge, '-Setup', $signed, '-Log', "$tmp\requests.log", '-StopFile', $stop)
          Start-Sleep 3

          # Everything the update path must not start, and the UAC prompt, watched while it runs.
          $spawn = Start-Job -ArgumentList "$tmp\spawn.log", "$dir" -ScriptBlock {
            param($log, $dir)
            $bad = 'schtasks.exe', 'reg.exe', 'powershell.exe', 'pwsh.exe', 'cmd.exe', 'consent.exe'
            while ($true) {
              foreach ($p in Get-CimInstance Win32_Process -ErrorAction SilentlyContinue) {
                if ($bad -contains $p.Name.ToLower()) {
                  $parent = Get-CimInstance Win32_Process -Filter "ProcessId=$($p.ParentProcessId)" -ErrorAction SilentlyContinue
                  $pp = if ($parent) { "$($parent.Name) $($parent.ExecutablePath)" } else { '?' }
                  Add-Content $log "$($p.Name) <- $pp"
                }
              }
              Start-Sleep -Milliseconds 150
            }
          }

          try {
            # 1.4.4 as a customer has it: installed, autostart on (the Run value 1.4.x writes), an old task left over.
            Check ((Start-Process -FilePath $old -ArgumentList $silent -Wait -PassThru).ExitCode -eq 0) '1.4.4 installs'
            Check ((Get-Service BoopVPN).Status -eq 'Running') '1.4.4 service Running'
            Check ((Binary) -match 'Boop\.exe"? --service') 'the service runs Boop.exe --service'
            Set-ItemProperty -Path $runKey -Name BoopVPN -Value "`"$dir\Boop.exe`" --tray"
            $runBefore = (Get-ItemProperty $runKey).BoopVPN
            schtasks.exe /Create /TN 'Boop VPN' /TR 'cmd.exe /c exit' /SC ONLOGON /RL HIGHEST /F | Out-Null
            Push-Location desktop
            try {
              $env:BOOP_E2E_MIGRATION = 'seed'
              go test -count=1 -run '^TestMigrationE2E$' .
              Check ($LASTEXITCODE -eq 0) 'signed in: the token and settings are written (DPAPI) as 1.4.4 keeps them'
            } finally { Pop-Location }
            Set-Content "$data\keep-data.txt" 'x'

            # The update, by the 1.4.4 service's own mechanism: the window's "update" request over the pipe.
            $c = [System.IO.Pipes.NamedPipeClientStream]::new('.', 'BoopVPN', [System.IO.Pipes.PipeDirection]::InOut)
            $c.Connect(15000)
            $w = [System.IO.StreamWriter]::new($c); $w.AutoFlush = $true
            $w.WriteLine('{"op":"update"}')
            $answer = [System.IO.StreamReader]::new($c).ReadLine()
            $c.Dispose()
            Write-Host "service answered: $answer"
            Check ($answer -match '"ok":true' -and $answer -match '2\.0\.0') '1.4.4 swapped in the bridge'

            $deadline = (Get-Date).AddSeconds(240)
            while (((Binary) -notmatch 'BoopService\.exe"? --service' -or (Get-Service BoopVPN).Status -ne 'Running') -and (Get-Date) -lt $deadline) { Start-Sleep 3 }
            Start-Sleep 8
          } finally {
            Stop-Job $spawn -ErrorAction SilentlyContinue
          }
          Check ((Binary) -match 'BoopService\.exe"? --service') 'the service now runs BoopService.exe'
          Check ((Get-Service BoopVPN).Status -eq 'Running') 'the service is Running'
          $req = Get-Content "$tmp\requests.log"
          Check (@($req | Where-Object { $_ -eq 'GET /bridge.exe' }).Count -eq 1) 'the bridge was downloaded once (by 1.4.4)'
          Check (@($req | Where-Object { $_ -eq 'GET /setup.exe' }).Count -eq 1) 'the setup program was downloaded once (by the bridge)'
          Check (Test-Path "$data\bridge.log") 'the bridge ran as the service'
          Check ((Get-Content "$data\bridge.log" -Raw) -match 'staged and checked') 'the bridge checked the setup program (hash, signature, publisher)'
          Check (Test-Path "$dir\Boop.exe") 'Boop.exe in Program Files'
          Check ((Get-Item "$dir\Boop.exe").Length -lt 12MB) 'Boop.exe is the Tauri window'
          Check ((Get-FileHash "$dir\Boop.exe").Hash -eq (Get-FileHash desktop/tauri/target/release/Boop.exe).Hash) 'Boop.exe is the 2.0.0 window'
          foreach ($f in 'BoopHost.exe', 'BoopService.exe', 'wintun.dll') { Check (Test-Path "$dir\$f") "$f installed" }
          Check (-not (Get-ChildItem $dir -Recurse -Include '*.old', '*.new' -ErrorAction SilentlyContinue)) 'no *.old / *.new next to the program'
          Check (-not (Test-Path "$data\update")) 'the staged setup program is removed'
          Check (-not (Test-Path "$data\after-bridge")) 'the bridge marker is consumed'
          Check (Test-Path "$data\keep-data.txt") 'the service data stays'
          Push-Location desktop
          try {
            $env:BOOP_E2E_MIGRATION = 'verify'
            go test -count=1 -run '^TestMigrationE2E$' .
            Check ($LASTEXITCODE -eq 0) 'token and settings are read by the new code: no sign-in needed'
          } finally { Pop-Location }
          Check ((Get-ItemProperty $runKey).BoopVPN -eq $runBefore) 'autostart: the Run value is kept and starts the new Boop.exe --tray'
          schtasks.exe /Query /TN 'Boop VPN' 2>$null | Out-Null
          Check ($LASTEXITCODE -ne 0) 'the old scheduled task is gone'
          $svc = Start-Process -FilePath "$dir\BoopHost.exe" -ArgumentList '--service-check' -Wait -PassThru
          Check ($svc.ExitCode -eq 0) 'host <-> new service'
          $spawned = if (Test-Path "$tmp\spawn.log") { Get-Content "$tmp\spawn.log" } else { @() }
          $fromApp = @($spawned | Where-Object { $_ -match 'Program Files\\Boop\\' -or $_ -match '^consent' })
          Check ($fromApp.Count -eq 0) "no schtasks/reg/powershell/cmd from Boop programs and no UAC prompt ($($fromApp -join '; '))"
          Check ($null -eq (Get-Process -Name consent -ErrorAction SilentlyContinue)) 'no consent.exe (UAC)'

          # Uninstall is clean.
          New-Item -ItemType File $stop | Out-Null
          Get-Process -Name Boop, BoopHost -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $u = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /PURGEDATA' -Wait -PassThru
          Check ($u.ExitCode -eq 0) 'uninstall exits 0'
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Service BoopVPN -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          Check ($null -eq (Get-Service BoopVPN -ErrorAction SilentlyContinue)) 'service removed'
          Check (-not (Test-Path "$dir\Boop.exe")) 'Boop.exe removed'
          Check (-not (Test-Path $data)) 'ProgramData\Boop removed'
          Check ($null -eq (Get-ItemProperty $runKey -ErrorAction SilentlyContinue).BoopVPN) 'the Run value is removed'
          exit 0 # schtasks /Query above fails on purpose

      - name: install, upgrade, uninstall (silent)
        run: |
          $setup = (Get-ChildItem desktop/dist/Boop-Setup-*.exe | Select-Object -First 1).FullName
          Write-Host "setup: $setup"
          $dir = Join-Path $env:ProgramFiles 'Boop'
          $data = Join-Path $env:ProgramData 'Boop'
          function Dump {
            foreach ($f in @("$data\install.log", "$data\service.log")) {
              if (Test-Path $f) { Write-Host "--- $f"; Get-Content $f -Tail 60 }
            }
            Get-ChildItem $env:TEMP -Filter 'Setup Log*' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName -Tail 60 }
          }
          function Check($ok, $what) {
            if (-not $ok) { Dump; throw "FAILED: $what" }
            Write-Host "ok: $what"
          }
          function Setup($argv) {
            (Start-Process -FilePath $setup -ArgumentList $argv -Wait -PassThru).ExitCode
          }
          $silent = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /LOG'

          Check ((Setup "$silent /TASKS=autostart") -eq 0) 'install exits 0'
          Check ((Get-Service BoopVPN).Status -eq 'Running') 'service BoopVPN is Running'
          Check (Test-Path "$dir\Boop.exe") 'Boop.exe in Program Files'
          Check (Test-Path "$dir\BoopHost.exe") 'BoopHost.exe in Program Files'
          Check (Test-Path "$dir\BoopService.exe") 'BoopService.exe in Program Files'
          Check (Test-Path "$dir\wintun.dll") 'wintun.dll in Program Files'
          Check (Test-Path "$dir\unins000.exe") 'uninstaller present'
          Check ([System.IO.Directory]::GetFiles('\\.\pipe\') -contains '\\.\pipe\BoopVPN') 'pipe BoopVPN exists'
          Check (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Boop VPN.lnk") 'Start menu shortcut'
          $acl = (Get-Acl $dir).Access | Where-Object { $_.IdentityReference -match 'Users$' }
          Check (($acl | Where-Object { $_.FileSystemRights -match 'Write|Modify|FullControl' }).Count -eq 0) 'Users cannot write Program Files\Boop'
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).BoopVPN
          Write-Host "Run key: $run"   # informational: the runner has no interactive shell for runasoriginaluser

          # Over an existing install (the service is running).
          Check ((Setup "$silent /TASKS=autostart") -eq 0) 'install over the existing one exits 0'
          Check ((Get-Service BoopVPN).Status -eq 'Running') 'service Running after upgrade'

          # Uninstall, data kept by default.
          New-Item -ItemType Directory -Force "$data" | Out-Null
          Set-Content "$data\keep.txt" 'x'
          $unins = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          Check ($unins.ExitCode -eq 0) 'uninstall exits 0'
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Service BoopVPN -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          while ((Test-Path "$dir\Boop.exe") -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          Check ($null -eq (Get-Service BoopVPN -ErrorAction SilentlyContinue)) 'service removed'
          Check (-not (Test-Path "$dir\Boop.exe")) 'Boop.exe removed'
          Check (-not (Test-Path "$dir\BoopHost.exe")) 'BoopHost.exe removed'
          Check (-not (Test-Path "$dir\BoopService.exe")) 'BoopService.exe removed'
          Check (-not (Test-Path "$dir\wintun.dll")) 'wintun.dll removed'
          Check (Test-Path "$data\keep.txt") 'data kept without /PURGEDATA'
          Check (-not (Test-Path 'HKCU:\Software\Classes\AppUserModelId\Boop.VPN')) 'toast AUMID key removed'
          Check (-not (Test-Path 'HKCU:\Software\Classes\boop')) 'boop: protocol key removed'

          # Again, now with /PURGEDATA.
          Check ((Setup $silent) -eq 0) 'second install exits 0'
          $unins = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /PURGEDATA' -Wait -PassThru
          Check ($unins.ExitCode -eq 0) 'uninstall /PURGEDATA exits 0'
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $data) -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          Check (-not (Test-Path $data)) 'ProgramData\Boop removed with /PURGEDATA'
          Check ($null -eq (Get-Service BoopVPN -ErrorAction SilentlyContinue)) 'service removed again'

      # Issue #81: update N -> N+1 through the host's own update path. N is the 1.5.1
      # setup program; the "host" is TestUpdateE2E (update_e2e_windows_test.go): it
      # downloads N+1 from a local HTTP server (the fake desktop.json), checks SHA-256
      # and the Authenticode signature (a CI self-signed certificate, trusted on this
      # runner only) and starts it through the real runSetup (one UAC-style runas).
      - name: update N to N+1 through desktop.json (hash and signature checks)
        timeout-minutes: 10
        run: |
          $dir = Join-Path $env:ProgramFiles 'Boop'
          $data = Join-Path $env:ProgramData 'Boop'
          function Check($ok, $what) {
            if (-not $ok) {
              foreach ($f in @("$data\install.log", "$data\service.log")) { if (Test-Path $f) { Write-Host "--- $f"; Get-Content $f -Tail 60 } }
              throw "FAILED: $what"
            }
            Write-Host "ok: $what"
          }
          $silent = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /LOG'
          $n1 = (Get-ChildItem desktop/dist/Boop-Setup-*.exe | Select-Object -First 1).FullName
          $v1 = ([regex]::Match($n1, 'Boop-Setup-(.+)\.exe$')).Groups[1].Value
          $old = (Get-ChildItem baseline151/desktop/dist/Boop-Setup-1.5.1.exe).FullName

          # A CI-only code-signing certificate, trusted here so WinVerifyTrust accepts it.
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Boop CI Test' -CertStoreLocation Cert:\CurrentUser\My
          $cer = Join-Path $env:RUNNER_TEMP 'boop-ci.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          $signed = Join-Path $env:RUNNER_TEMP 'Setup-signed.exe'
          $unsigned = Join-Path $env:RUNNER_TEMP 'Setup-unsigned.exe'
          Copy-Item $n1 $signed; Copy-Item $n1 $unsigned
          $r = Set-AuthenticodeSignature -FilePath $signed -Certificate $cert -HashAlgorithm SHA256
          Check ($r.Status -eq 'Valid') "the test setup program is signed ($($r.Status))"

          $e2e = @{ BOOP_E2E_UPDATE = '1'; BOOP_E2E_SETUP = $signed; BOOP_E2E_VERSION_N = '1.5.1'; BOOP_E2E_VERSION_N1 = $v1; BOOP_E2E_PUBLISHER = 'Boop CI Test' }
          foreach ($k in $e2e.Keys) { Set-Item "env:$k" $e2e[$k] }

          Check ((Start-Process -FilePath $old -ArgumentList $silent -Wait -PassThru).ExitCode -eq 0) 'N (1.5.1) installs'
          Check ((Get-Service BoopVPN).Status -eq 'Running') 'N service Running'
          $mine = Join-Path $env:LOCALAPPDATA 'Boop'
          New-Item -ItemType Directory -Force $mine | Out-Null
          Set-Content "$mine\keep-settings.txt" 'x'
          Set-Content "$data\keep-data.txt" 'x'
          $hostHashBefore = if (Test-Path "$dir\BoopHost.exe") { (Get-FileHash "$dir\BoopHost.exe").Hash } else { '' }

          Push-Location desktop
          try {
            # Refusals first: swapped hash, unsigned setup, signer that is not the publisher.
            $env:BOOP_E2E_MODE = 'refuse'
            $env:BOOP_E2E_UNSIGNED_SETUP = $unsigned
            go test -count=1 -run '^TestUpdateE2E$' -v .
            Check ($LASTEXITCODE -eq 0) 'swapped hash, unsigned and foreign-signed setup programs are not started'
            Check ((Get-Service BoopVPN).Status -eq 'Running') 'N untouched after the refusals'
            Check ((Test-Path "$dir\BoopHost.exe") -eq [bool]$hostHashBefore) 'N files untouched after the refusals'

            # The update: exactly one setup process, started by the host's runSetup.
            $env:BOOP_E2E_MODE = 'apply'
            Remove-Item env:BOOP_E2E_UNSIGNED_SETUP
            go test -count=1 -run '^TestUpdateE2E$' -v .
            Check ($LASTEXITCODE -eq 0) 'the host downloaded, verified and started one setup program'
          } finally { Pop-Location }

          $deadline = (Get-Date).AddSeconds(180)
          function Same($name, $src) { (Test-Path "$dir\$name") -and ((Get-FileHash "$dir\$name").Hash -eq (Get-FileHash $src).Hash) }
          while (-not (Same 'BoopHost.exe' 'desktop/dist/BoopHost.exe') -and (Get-Date) -lt $deadline) { Start-Sleep 3 }
          # The setup program finishes after it replaced the files; wait for it to be gone.
          while ((Get-Process -Name 'Boop-Setup*','*.tmp' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like '*Boop-Setup*' -or $_.Path -like '*is-*' }) -and (Get-Date) -lt $deadline) { Start-Sleep 3 }
          Start-Sleep 5
          Check (Same 'BoopHost.exe' 'desktop/dist/BoopHost.exe') 'BoopHost.exe is N+1'
          Check (Same 'BoopService.exe' 'desktop/dist/BoopService.exe') 'BoopService.exe is N+1'
          Check (Same 'Boop.exe' 'desktop/tauri/target/release/Boop.exe') 'Boop.exe is N+1'
          Check ((Get-Service BoopVPN).Status -eq 'Running') 'the service runs after the update'
          Check ((Get-CimInstance Win32_Service -Filter "Name='BoopVPN'").PathName -match 'BoopService\.exe"? --service') 'the service runs BoopService.exe'
          Check (-not (Get-ChildItem $dir -Recurse -Include '*.old','*.new' -ErrorAction SilentlyContinue)) 'no *.old / *.new files'
          Check (Test-Path "$mine\keep-settings.txt") 'the user settings stay'
          Check (Test-Path "$data\keep-data.txt") 'the service data and token stay'
          $svc = Start-Process -FilePath "$dir\BoopHost.exe" -ArgumentList '--service-check' -Wait -PassThru
          Check ($svc.ExitCode -eq 0) 'host <-> service after the update'

          Get-Process -Name Boop, BoopHost -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /PURGEDATA' -Wait | Out-Null

      # Issue #78 / #79: connect through the service the setup program registered.
      # The test (vpn/xray/service_e2e_windows_test.go) is the window: a fake panel
      # hands out a VLESS node (Xray-core in the test process, on loopback), the test
      # sends `up` over the pipe, checks `status`, carries bytes through the tunnel,
      # sends `down`, and checks that the adapter, routes and WFP filters are gone.
      - name: connect through the installed service (fake panel, local Xray node)
        timeout-minutes: 8
        env:
          BOOP_E2E_SERVICE: "1"
        run: |
          $setup = (Get-ChildItem desktop/dist/Boop-Setup-*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:ProgramFiles 'Boop'
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /LOG' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exited $($p.ExitCode)" }
          Push-Location desktop
          try {
            go test -c -o "$env:RUNNER_TEMP\svc-e2e.test.exe" ./vpn/xray/
            if ($LASTEXITCODE -ne 0) { throw 'building the e2e test failed' }
          } finally { Pop-Location }
          try {
            $targs = @('-test.run=^TestServiceConnect$', '-test.v', '-test.timeout=5m')
            & "$env:RUNNER_TEMP\svc-e2e.test.exe" @targs
            $code = $LASTEXITCODE
          } finally {
            # Whatever happened, the tunnel must not outlive the step.
            Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /PURGEDATA' -Wait | Out-Null
          }
          if ($code -ne 0) {
            foreach ($f in @("$env:ProgramData\Boop\service.log")) {
              if (Test-Path $f) { Write-Host "--- $f"; Get-Content $f -Tail 80 }
            }
            throw "connect through the service failed ($code)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Boop-Setup-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            desktop/dist/Boop-Setup-*.exe
            desktop/dist/Boop-Setup-*.exe.sha256
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: installer-logs
          path: |
            C:\ProgramData\Boop\*.log
          retention-days: 7
          if-no-files-found: ignore

  # Stage C-4 of #76: the pipe client of the Tauri shell (desktop/tauri/host) has no GUI
  # dependencies, so it is checked here; the window itself is built on Windows below.
  tauri-host:
    name: Tauri shell, pipe client (clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            desktop/tauri/target
          key: tauri-host-${{ hashFiles('desktop/tauri/Cargo.lock') }}
      - run: cargo clippy -p boop-host --all-targets --locked -- -D warnings
        working-directory: desktop/tauri
      - run: cargo test -p boop-host --locked
        working-directory: desktop/tauri
      - name: no command line tools in the Rust shell
        # The shell starts its own host (BoopHost.exe / BOOP_HOST_EXE) and nothing else.
        run: |
          if grep -rnE '"(schtasks|reg|powershell|pwsh|cmd)(\.exe)?"|ShellExecute' desktop/tauri/app/src desktop/tauri/host/src; then
            echo "::error::the Rust shell must not run schtasks/reg/powershell/cmd or ShellExecute"; exit 1
          fi
        working-directory: .

  # The Tauri window on Windows: built, linted, and started next to the installed 1.5.1
  # service. Smoke: the shell starts the Go host (`Boop.exe --host`), connects to its pipe,
  # gets the first UI state, and closes itself and the host. The installer still installs the
  # Go window (C-4b switches it).
  windows-tauri:
    name: Tauri window on Windows (build + smoke)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Boop-go-${{ github.event.pull_request.head.sha || github.sha }}
          path: desktop/dist

      - uses: actions/download-artifact@v4
        with:
          name: wintun-${{ github.event.pull_request.head.sha || github.sha }}
          path: desktop/build

      - uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            desktop\tauri\target
          key: tauri-win-${{ hashFiles('desktop/tauri/Cargo.lock') }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Go host (hostpipe) tests
        run: go test ./hostpipe
        working-directory: desktop

      - name: UI for the Tauri window
        shell: bash
        run: ./desktop/tauri/prepare-ui.sh

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: desktop/tauri

      - name: tests
        run: cargo test --workspace --locked
        working-directory: desktop/tauri

      - name: build Boop.exe (Tauri)
        run: cargo build --release -p boop-shell --locked
        working-directory: desktop/tauri

      - name: size and contents
        run: |
          $exe = Get-Item desktop/tauri/target/release/Boop.exe
          $mb = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "Tauri Boop.exe: $mb MB"
          if ($exe.Length -gt 12MB) { throw "Tauri Boop.exe is $mb MB (limit about 10 MB)" }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($bad in 'xray-core', 'amneziawg') {
            if ($text.Contains($bad)) { throw "the Tauri window contains $bad" }
          }

      - name: Inno Setup
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: build the setup program (Tauri window + Go host + service)
        run: ./desktop/installer/build.ps1

      - name: smoke - the installed Tauri window, its host and the service
        run: |
          $setup = (Get-ChildItem desktop/dist/Boop-Setup-*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:ProgramFiles 'Boop'
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /LOG /TASKS=autostart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exited $($p.ExitCode)" }
          $svc = Get-Service BoopVPN
          if ($svc.Status -ne 'Running') { throw "service is $($svc.Status)" }
          foreach ($f in 'Boop.exe', 'BoopHost.exe', 'BoopService.exe', 'wintun.dll') {
            if (-not (Test-Path "$dir\$f")) { throw "$f is not in $dir" }
          }
          Write-Host 'ok: service running, Boop.exe + BoopHost.exe + BoopService.exe installed'

          # The installed window finds its host next to itself (no BOOP_HOST_EXE).
          $log = Join-Path $PWD 'shell.log'
          $env:BOOP_SHELL_LOG = $log
          $env:BOOP_SHELL_EXIT_AFTER_STATE = '1'
          $shell = Start-Process -FilePath "$dir\Boop.exe" -PassThru
          if (-not $shell.WaitForExit(180000)) {
            $shell.Kill()
            $why = 'the shell did not get a state and close within 180 s'
          } elseif ($shell.ExitCode -ne 0) {
            $why = "the shell exited with $($shell.ExitCode)"
          }
          $hostLog = Join-Path $env:LOCALAPPDATA 'Boop\boop-host.log'
          Write-Host '--- shell.log'; if (Test-Path $log) { Get-Content $log }
          Write-Host '--- boop-host.log'; if (Test-Path $hostLog) { Get-Content $hostLog -Tail 40 }
          if ($why) { throw $why }
          $text = Get-Content $log -Raw
          if ($text -notmatch 'hello ok') { throw 'the shell did not reach the host over the pipe' }
          if ($text -notmatch 'state conn=') { throw 'the shell got no state from the host' }
          if ((Get-Content $hostLog -Raw) -match 'service: ') { throw 'the host could not reach the service' }
          Start-Sleep -Seconds 3
          if (Get-Process -Name BoopHost -ErrorAction SilentlyContinue) { throw 'the host is still running after the shell closed' }
          Write-Host 'ok: window started, host reached over the pipe, first state received, closed cleanly'
          Remove-Item Env:BOOP_SHELL_EXIT_AFTER_STATE

      - name: chain - hidden --tray start, boop:open into the running window
        run: |
          $dir = Join-Path $env:ProgramFiles 'Boop'
          $log = Join-Path $PWD 'tray.log'
          $env:BOOP_SHELL_LOG = $log
          $shell = Start-Process -FilePath "$dir\Boop.exe" -ArgumentList '--tray' -PassThru
          $deadline = (Get-Date).AddSeconds(120)
          while (-not ((Test-Path $log) -and ((Get-Content $log -Raw) -match 'hello ok')) -and (Get-Date) -lt $deadline) { Start-Sleep 1 }
          if (-not ((Test-Path $log) -and ((Get-Content $log -Raw) -match 'hello ok'))) { throw 'the --tray shell did not reach the host' }
          $deadline = (Get-Date).AddSeconds(30)
          while (-not ((Get-Content $log -Raw) -match 'window visible=') -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          Start-Sleep -Seconds 2
          $shell.Refresh()
          if ($shell.HasExited) { throw '--tray: the shell exited' }
          $txt = Get-Content $log -Raw
          if ($txt -notmatch 'window visible=false') { throw '--tray: the shell did not report a hidden window (window visible=false)' }
          if ($txt -match 'window visible=true|window shown') { throw '--tray: a window is visible, it must start hidden (tray only)' }
          Write-Host 'ok: --tray starts hidden'

          # A toast button starts `Boop.exe boop:<action>`: it must reach the running shell
          # through single-instance (the second process exits) and show the window.
          $second = Start-Process -FilePath "$dir\Boop.exe" -ArgumentList 'boop:open' -PassThru
          if (-not $second.WaitForExit(60000)) { $second.Kill(); throw 'the boop:open launch did not hand over and exit' }
          $deadline = (Get-Date).AddSeconds(30)
          do { Start-Sleep -Milliseconds 500 } while (-not ((Get-Content $log -Raw) -match 'window shown visible=true') -and (Get-Date) -lt $deadline)
          if ((Get-Content $log -Raw) -notmatch 'window shown visible=true') { throw 'boop:open did not show the window of the running shell' }
          Write-Host 'ok: boop:open went through single-instance and showed the window'
          $act = Start-Process -FilePath "$dir\Boop.exe" -ArgumentList 'boop:reconnect' -PassThru
          if (-not $act.WaitForExit(60000)) { $act.Kill(); throw 'the boop:reconnect launch did not exit' }
          Start-Sleep -Seconds 2
          if ($shell.HasExited) { throw 'the shell died on boop:reconnect' }
          if (-not (Get-Process -Name BoopHost -ErrorAction SilentlyContinue)) { throw 'the host is gone after boop:reconnect' }
          Write-Host 'ok: boop:reconnect delivered, shell and host alive'
          Write-Host '--- tray.log'; Get-Content $log
          Stop-Process -Name Boop, BoopHost -Force -ErrorAction SilentlyContinue
          Remove-Item Env:BOOP_SHELL_LOG

      - name: chain - the autostart switch writes the Run value the installer and 1.4.x/1.5.x understand
        run: |
          $dir = Join-Path $env:ProgramFiles 'Boop'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $helper = Join-Path $PWD 'desktop/scripts/host-pipe.ps1'
          Stop-Process -Name Boop, BoopHost -Force -ErrorAction SilentlyContinue
          # The installed host alone, on a pipe of its own (the shell would take the connection).
          $h = Start-Process -FilePath "$dir\BoopHost.exe" -ArgumentList '--host', '--pipe', '\\.\pipe\BoopApp-e2e-autostart' -PassThru
          function Call($json) { (& pwsh -NoProfile -File $helper -Pipe 'BoopApp-e2e-autostart' -Request $json) }
          try {
            $hello = Call '{"id":1,"method":"hello"}'
            Write-Host "hello: $hello"
            $r = Call '{"id":2,"method":"call","name":"setAutostart","arg":true}'
            Write-Host "setAutostart true: $r"
            $v = (Get-ItemProperty $runKey -ErrorAction SilentlyContinue).BoopVPN
            Write-Host "Run value: $v"
            if ($v -ne "`"$dir\Boop.exe`" --tray") { throw "the Run value is not the installed Boop.exe --tray: $v" }
            $r = Call '{"id":3,"method":"call","name":"setAutostart","arg":false}'
            Write-Host "setAutostart false: $r"
            if ((Get-ItemProperty $runKey -ErrorAction SilentlyContinue).BoopVPN) { throw 'the Run value is still there after switching autostart off' }
            Write-Host 'ok: the switch writes and removes the Run value'
            $null = Call '{"id":4,"method":"quit"}'
          } finally {
            if (-not $h.HasExited) { Stop-Process -Id $h.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: portable Tauri copy registers nothing
        run: |
          $dir = Join-Path $env:ProgramFiles 'Boop'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $runBefore = (Get-ItemProperty $runKey -ErrorAction SilentlyContinue).BoopVPN
          $posFile = Join-Path $env:LOCALAPPDATA 'Boop\window.json'
          Remove-Item $posFile -ErrorAction SilentlyContinue
          # A copy of the shell and the host outside Program Files.
          $run = Join-Path $PWD 'tauri-run'
          New-Item -ItemType Directory -Force $run | Out-Null
          Copy-Item "$dir\Boop.exe", "$dir\BoopHost.exe" $run
          $log = Join-Path $run 'shell.log'
          $env:BOOP_SHELL_LOG = $log
          $env:BOOP_SHELL_EXIT_AFTER_STATE = '1'
          $shell = Start-Process -FilePath "$run\Boop.exe" -PassThru
          if (-not $shell.WaitForExit(180000)) { $shell.Kill(); throw 'the portable shell did not close' }
          if ($shell.ExitCode -ne 0) { throw "the portable shell exited with $($shell.ExitCode)" }
          $text = Get-Content $log -Raw
          if ($text -notmatch 'hello ok') { throw 'the portable shell did not reach its host' }
          $extra = Get-ChildItem $run | Where-Object { $_.Name -notin @('Boop.exe', 'BoopHost.exe', 'shell.log') }
          if ($extra) { throw "the portable copy wrote files next to itself: $($extra.Name -join ', ')" }
          if ((Get-ItemProperty $runKey -ErrorAction SilentlyContinue).BoopVPN -ne $runBefore) { throw 'the portable copy changed the autostart value' }
          if (Test-Path $posFile) { throw 'the portable copy remembered the window position' }
          Write-Host 'ok: the portable copy registered and wrote nothing'
          Remove-Item Env:BOOP_SHELL_LOG, Env:BOOP_SHELL_EXIT_AFTER_STATE

      - name: uninstall
        if: always()
        run: |
          $dir = Join-Path $env:ProgramFiles 'Boop'
          if (Test-Path "$dir\unins000.exe") {
            Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /PURGEDATA' -Wait | Out-Null
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Boop-tauri-${{ github.event.pull_request.head.sha || github.sha }}
          path: desktop/tauri/target/release/Boop.exe
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tauri-logs
          path: |
            C:\ProgramData\Boop\*.log
            tauri-run\*.log
            shell.log
            tray.log
          retention-days: 7
          if-no-files-found: ignore
