<!doctype html>
<html lang="{{lang}}" data-bot="{{bot}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Boop</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/tg/app.css?v={{v}}">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/tg/app.js?v={{v}}" defer></script>
</head>
<body>
<div class="shell" id="shell">
  <header class="bar" id="bar">
    <span class="brand"><img src="/favicon.svg" alt="" width="26" height="26">Boop</span>
    <span class="bar-title" id="title"></span>
  </header>
  <main class="view" id="view" aria-live="polite">
    <div class="splash" id="splash"><img src="/favicon.svg" alt="" width="56" height="56"><div class="dots"><i></i><i></i><i></i></div></div>
  </main>
  <nav class="tabs" id="tabs" hidden></nav>
</div>
<template id="outside">
  <section class="outside">
    <img class="outside-logo" src="/favicon.svg" alt="" width="72" height="72">
    <h1>{{t:Open Boop in Telegram}}</h1>
    <p class="muted">{{t:This page works inside our Telegram bot. Open the bot and tap Open.}}</p>
    <a class="btn wide" id="botlink" href="#">{{t:Open the bot}}</a>
    <a class="link" href="/">{{t:Go to the website}}</a>
  </section>
</template>
</body>
</html>
