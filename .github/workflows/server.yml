# CI for the panel server (server/, shared/): tests (including the i18n check) and the
# distribution build. No secrets, no deploys.
name: server

on:
  pull_request:
    paths:
      - "server/**"
      - "shared/**"
      - "web/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/server.yml"
  push:
    branches: [claude/adoring-brown-s8fqex]
    paths:
      - "server/**"
      - "shared/**"
      - "web/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: server tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: server tests
        run: ./gradlew :server:test --no-daemon --stacktrace

      - name: server build
        run: ./gradlew :server:build -x test --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-test-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: server/build/reports/tests
          if-no-files-found: ignore
