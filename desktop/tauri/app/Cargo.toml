[package]
name = "boop-shell"
version = "2.0.0"
edition = "2021"
publish = false
description = "Boop VPN for Windows: the Tauri 2 window and tray (core.App is Boop.exe --host)"

[[bin]]
name = "Boop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
boop-host = { path = "../host" }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
