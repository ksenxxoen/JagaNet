<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="robots" content="noindex" />

    <title>Boop</title>

  <body>

        id="go"

        >{{t:Open the app}}</a

      <p id="bad" class="m-0 text-warn-text" hidden>{{t:This link doesn't work. Go back to Telegram and try again.}}</p>
      <p class="m-0 text-[13px] text-muted">
        <a href="https://www.happ.su/main/" rel="noreferrer">Happ</a>, <a href="https://v2raytun.com/" rel="noreferrer">v2RayTun</a>
